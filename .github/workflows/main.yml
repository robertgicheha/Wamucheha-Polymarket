name: Main Branch — Test, Version & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  DEPLOY_PATH: /opt/wamucheha-polymarket

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest-cov

      - name: Lint with ruff
        run: ruff check . --output-format github

      - name: Type check with mypy
        run: mypy --ignore-missing-imports --no-error-summary ml/ data/ strategies/ connectors/ config/ || true
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=. --cov-report=term-missing || true
        continue-on-error: true

  version:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version from commits
        id: version
        run: |
          # Get last tag — fall back to v0.0.0 if none exist
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Last tag: $LAST_TAG"

          # Count commits since last tag
          if [ "$LAST_TAG" = "v0.0.0" ]; then
            COMMITS=$(git rev-list HEAD --count)
          else
            COMMITS=$(git rev-list "${LAST_TAG}..HEAD" --count)
          fi
          echo "Commits since last tag: $COMMITS"

          # Parse semantic version
          VERSION=${LAST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # Default to patch bump
          BUMP="patch"

          # Check commit messages for version bump type
          if [ "$LAST_TAG" = "v0.0.0" ]; then
            COMMIT_LOG=$(git log --oneline)
          else
            COMMIT_LOG=$(git log "${LAST_TAG}..HEAD" --oneline)
          fi

          if echo "$COMMIT_LOG" | grep -qEi "^[a-f0-9]+ (feat[!:]|add|new)"; then
            BUMP="minor"
          fi
          if echo "$COMMIT_LOG" | grep -qEi "^[a-f0-9]+ (feat!|BREAKING)"; then
            BUMP="major"
          fi

          case $BUMP in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          NEW_TAG="v$NEW_VERSION"
          echo "Bump type: $BUMP -> $NEW_TAG"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.version.outputs.tag }} -m "Release ${{ steps.version.outputs.tag }}"
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          draft: false
          prerelease: false

  deploy:
    needs: [test, version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            git fetch --tags
            git checkout ${{ needs.version.outputs.tag }}
            pip install -r requirements.txt --quiet
            pip install -r admin/requirements.txt --quiet
            systemctl restart wamucheha-bot || true
            echo "Production deployment ${{ needs.version.outputs.tag }} complete at $(date)"

      - name: Notify deployment
        if: always()
        run: |
          echo "Main branch ${{ needs.version.outputs.tag }} deployed to ${{ secrets.VPS_HOST }}"
