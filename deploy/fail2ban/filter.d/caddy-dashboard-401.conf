# fail2ban filter for the Caddy dashboard access log.
#
# Caddy writes one JSON object per line. Within that object the request block
# (which carries remote_ip) is serialised before the response status, so a
# single-line match can extract the offending IP and require a 401.
#
# The 401 is Caddy rejecting Basic Auth — i.e. failed password attempts.

[Definition]

# Caddy's struct order puts "request" before "status" on one line, so
# [^\\n]* bridges the two without depending on the rest of the payload.
failregex = ^\{.*"request":\{"remote_ip":"<HOST>"[^\n]*"status":401\s*[,}].*$

ignoreregex =

# Caddy's own timestamp is a numeric epoch; the surrounding JSON has no
# human-readable date, so let fail2ban fall back to the file mtime.
datepattern = {^LN-BEG}
