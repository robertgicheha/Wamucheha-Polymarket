# Brute-force protection for the public dashboard.
#
# Ten wrong passwords inside five minutes earns a ten-minute ban. The
# threshold is deliberately generous: a single person fumbling their own
# password should not lock themselves out of the thing they use to watch
# live trades, but a scripted attack never tries one password.

[caddy-dashboard]
enabled  = true
filter   = caddy-dashboard-401
logpath  = /var/log/caddy/wamucheha-access.log
port     = http,https
findtime = 300
maxretry = 10
bantime  = 600
